# Custom SLM version
CONFIG_SLM_CUSTOMER_VERSION="nuSIM v0.1.0"

# Enable SPI and use of external flash.
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Make sure SPI read/writes are word aligned using RAM buffer.
CONFIG_SPI_NRFX_RAM_BUFFER_SIZE=32

# This config is needed because SPI NOR is not a device specific DT node.
# This can be removed when DT_CHOSEN(nor,pm-ext-flash) is set by a Kconfig.
CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y

# Enable nuSIM Application LIB
CONFIG_LIB_NUSIM=y

# PM size reduced
CONFIG_PM_PARTITION_SIZE_TFM=0x2FE00
CONFIG_PM_PARTITION_SIZE_TFM_SRAM=0x10000

# Turn off interrupt driven UART (enabled in nuSIM)
CONFIG_UART_INTERRUPT_DRIVEN=n

# Disable commands to save app flash space
CONFIG_SLM_FTPC=n
CONFIG_SLM_TFTPC=n
CONFIG_SLM_HTTPC=n
CONFIG_SLM_MQTTC=n
CONFIG_SLM_SMS=n
#CONFIG_SLM_GNSS=n
#CONFIG_SLM_NRF_CLOUD=n
#CONFIG_SLM_TWI=n
#CONFIG_SLM_GPIO=n
